s://www.nice.org.uk/guidance/htg736\",\"type\":\"EVA\",\"date\":\"December 2024\"},{\"ref\":\"NICE MTG68\",\"url\":\"https://www.nice.org.uk/guidance/mtg68\",\"type\":\"MTG\",\"date\":\"March 2022\"}],\"evidence_summary\":\"Two RCTs (RESCUE n=41, EARLY n=60), five real-world studies including NHS Grampian (n=64) and NHS Highland (n=113), and a NICE MTG68 health economics review. NICE MTG68 modelled £86,297 cost saving per CCG for AECOPD (74% probability) and £22,779 per CCG for PR (86% probability). Note: CCG-era model — recalculate using current ICB population sizes.\",\"evidence_strength\":\"strong\",\"evidence_strength_rationale\":\"NICE/EAG found multiple myCOPD RCTs, and the PR guidance says myCOPD had well-designed RCT evidence supporting digital-vs-face-to-face non-inferiority. Real-world NHS use is mixed but materially broad.\",\"case_studies\":[{\"title\":\"NHS Grampian, inhaler technique and admission reduction\",\"setting\":\"Stonehaven Medical Group \u0026 Aberdeenshire HSCP, primary care, 5 months\",\"sample_size\":64,\"outcome\":\"Inhaler technique improved from 48% to 91% correct. Rescue inhaler use fell from 3.17 to 2.13 per week. Reduction in unscheduled GP visits and hospital admissions.\",\"caveat\":\"Service evaluation, not peer-reviewed. Outcomes reflect specific local deployment conditions.\",\"source\":\"my mhealth evidence catalogue (mymhealth.com/studies)\"},{\"title\":\"Jersey, engagement and daily use\",\"setting\":\"Jersey Health and Community Services\",\"sample_size\":null,\"outcome\":\"60% daily login rate. 800+ educational video views per week.\",\"caveat\":\"Source is a Respiratory Nurse Specialist report, not peer-reviewed.\",\"source\":\"my mhealth / Jersey evaluation\"},{\"title\":\"NHS Highland, remote and rural feasibility\",\"setting\":\"NHS Highland, up to 1 year\",\"sample_size\":113,\"outcome\":\"78.8% activation rate. No correlation with age, wealth, rurality or COPD severity. Very high-use subgroup (17%) showed moderate reduction in admissions and bed days.\",\"caveat\":\"No significant population-level reduction in NHS resource use in the full cohort. Peer-reviewed (JMIR mHealth 2022).\",\"source\":\"Cooper et al., JMIR mHealth 2022, DOI: 10.2196/30782\"}],\"maturity_level\":\"scaled\",\"live_sites\":\"NHS Grampian, NHS Dorset ICS, NHS Highland, Kent Community Health NHS FT, Southend University Hospital, Portsmouth Hospitals NHS Trust, Jersey\",\"named_sites\":[{\"name\":\"NHS Grampian\",\"status\":\"active\"},{\"name\":\"NHS Dorset ICS\",\"status\":\"active\"},{\"name\":\"NHS Highland\",\"status\":\"active\"},{\"name\":\"Kent Community Health NHS FT\",\"status\":\"active\"},{\"name\":\"Southend University Hospital\",\"status\":\"active\"},{\"name\":\"Portsmouth Hospitals NHS Trust\",\"status\":\"active\"},{\"name\":\"Jersey\",\"status\":\"active\"}],\"live_icbs\":5,\"patients_covered_note\":\"100,000+ patients across all my mhealth conditions globally. Multiple named NHS sites active.\",\"dtac_status\":\"passed_refresh_required\",\"dtac_note\":\"Central DTAC completion is over 3 years old. Updated DTAC form (February 2026) applies from April 2026. Commissioning organisations must request the current form from my mhealth and complete local due diligence.\",\"device_class\":\"Class I SaMD\",\"dcb0129_status\":\"Confirmed\",\"dcb0160_boilerplate_available\":true,\"dspt_status\":\"Compliant\",\"iso27001\":\"Not confirmed in reviewed sources\",\"cyber_essentials\":\"Held (annual renewal required)\",\"gdpr_note\":\"UK/EU-based servers. Data Processing Agreement available for NHS organisations.\",\"target_patients\":\"Adults aged 18+ with COPD (all GOLD grades A–E), including mild, moderate, severe and newly diagnosed.\",\"exclusions\":\"Not confirmed for patients requiring active clinical monitoring who cannot access internet-connected devices without support.\",\"onboarding_model\":\"clinician_led\",\"onboarding_detail\":\"Commissioner engagement → infrastructure assessment → pathway embedding with clinical teams → staff training → patient invitation or self-referral. Digital Health Advisors support patients.\",\"supplier_wrap\":\"Digital Transformation Team supports infrastructure assessment, pathway embedding, staff training and patient onboarding. Dashboard support included in contract.\",\"local_wraparound\":\"medium\",\"local_wraparound_detail\":\"Essentials tier: respiratory clinical lead and practice manager required. Pro tier: clinician capacity needed to actively monitor dashboard, without this, the Pro tier's value is unrealised.\",\"training_required\":true,\"training_note\":\"HCP dashboard training and pathway integration materials provided by my mhealth clinical engagement specialists.\",\"monitoring_note\":\"Essentials: patient self-managed. Pro: clinician dashboard with remote monitoring — not a 24/7 monitored service. Patients must have clear escalation routes for deterioration.\",\"escalation_note\":\"Patients must have clear routes to clinical support for deterioration. The app itself is not a monitored emergency service.\",\"operating_hours_caveat\":\"This is not a continuously monitored service. Ensure patients have access to appropriate clinical escalation routes.\",\"implementation_prerequisites\":[\"Respiratory clinical lead to champion adoption\",\"Pathway agreement with clinical teams\",\"DTAC approval confirmed locally\",\"Evidence generation agreement with NICE\",\"Firewall rules updated to permit mymhealth.com domain\"],\"pricing_model\":\"National negotiated rate\",\"national_price_available\":true,\"indicative_price_text\":\"National framework pricing available. Indicative cost per patient per year is in the range of £50–£100 depending on volume and modules selected. Contact supplier for current pricing schedule.\",\"pricing_confidence\":\"supplier_reported\",\"free_offer_flag\":false,\"service_wrap_included\":true,\"service_wrap_description\":\"Standard contract includes implementation support, clinical dashboard access, patient technical support, and quarterly reporting. Enhanced wrap with EPR integration and bespoke reporting available at additional cost.\",\"service_wrap_note\":\"Standard contract includes implementation support, clinical dashboard access, patient technical support, and quarterly reporting. Enhanced wrap with EPR integration and bespoke reporting available at additional cost.\",\"contract_note\":\"Contract/licence agreement with my mhealth required before deployment. G-Cloud and direct ICB routes available.\",\"procurement_notes\":\"G-Cloud and direct ICB procurement routes available. 3-year contract typical.\",\"expected_benefit_note\":\"Potential to reduce face-to-face PR appointments and extend PR capacity. May contribute to lower emergency admission rates for COPD, though attribution is difficult to isolate. Benefits are most clearly realised where the app is embedded in existing clinical pathways rather than offered as a standalone tool.\",\"tariff_considerations\":\"NICE MTG68 modelled £86,297 cost saving per CCG (AECOPD, 74% probability) and £22,779 per CCG (PR, 86% probability). These are CCG-era models — CCGs dissolved July 2022. Commissioners should recalculate using current ICB/PCN population size and local COPD prevalence. Digital PR is not currently separately reimbursed under national tariff; consider whether savings from reduced face-to-face PR offset the per-patient licence cost.\",\"provider_income_note\":\"Providers delivering face-to-face PR may see reduced activity if digital PR diverts referrals. Consider gainshare or pathway redesign arrangements to align incentives.\",\"roi_note\":\"Supplier-reported ROI models suggest cost savings of £200–£400 per patient compared with face-to-face PR, primarily from reduced venue and staffing costs. Independent validation of these figures in the NHS context is limited. NHS Grampian service evaluation also signalled fewer unscheduled contacts. Commissioners should request site-specific modelling.\",\"nhse_125k_eligible\":false,\"nhse_125k_note\":\"Clinitouch is explicitly named in NHSE winter 2024 COPD funding. myCOPD eligibility not confirmed, verify with NHSE before including in business case.\",\"demo_variants\":[{\"label\":\"Product website\",\"url\":\"https://mymhealth.com\",\"type\":\"website\"}],\"demo_notes\":\"Live demo environment not publicly available. Contact my mhealth via mymhealth.com/contact-us.\",\"last_reviewed_date\":\"2026-03-17\",\"source_summary\":\"NICE HTG736, NICE MTG68, JMIR mHealth Cooper et al. 2022, my mhealth evidence catalogue, NHS Grampian service evaluation, Jersey evaluation report.\",\"confidence_note\":\"Content based on publicly available information. All claims should be verified with my mhealth before use in procurement documentation.\",\"decommissioning_alert\":\"BNSSG ICB decommissioned myCOPD in January 2025 (no new enrolments). Reasons not publicly documented — investigate before commissioning in similar environments.\",\"clinical_evidence_detailed\":[{\"id\":\"rescue-rct\",\"ref\":\"RESCUE trial (MMH-R02)\",\"type\":\"RCT\",\"type_label\":\"Randomised controlled trial\",\"authors\":\"North M et al.\",\"journal\":\"npj Digital Medicine\",\"year\":2020,\"month\":\"October\",\"volume_issue\":\"3:145\",\"doi\":\"10.1038/s41746-020-00347-7\",\"pmid\":\"33145441\",\"pmc\":null,\"trial_reg\":null,\"url_doi\":\"https://doi.org/10.1038/s41746-020-00347-7\",\"url_pubmed\":\"https://pubmed.ncbi.nlm.nih.gov/33145441/\",\"url_full_text\":\"https://www.nature.com/articles/s41746-020-00347-7\",\"n\":41,\"setting\":\"Portsmouth Hospitals NHS Trust\",\"key_results\":\"CAT score 4.49 points lower in myCOPD arm (95% CI −8.41 to −0.58). Critical inhaler errors: 101→20 (myCOPD) vs 100→72 (usual care). Exacerbations: 18 vs 34. OR for readmission 0.383 (0.074–1.987).\",\"study_limitation\":\"Feasibility study, signals clinical benefit but powered for feasibility not efficacy.\",\"peer_reviewed\":true,\"coi\":false,\"data_quality_flag\":false,\"data_quality_note\":null},{\"id\":\"early-rct\",\"ref\":\"EARLY trial (MMH-R03)\",\"type\":\"RCT\",\"type_label\":\"Randomised controlled trial\",\"authors\":\"Crooks MG et al.\",\"journal\":\"ERJ Open Research\",\"year\":2020,\"month\":\"October\",\"volume_issue\":\"6(4):00460-2020\",\"doi\":\"10.1183/23120541.00460-2020\",\"pmid\":\"33263052\",\"pmc\":\"7682704\",\"trial_reg\":\"NCT03620630\",\"url_doi\":\"https://doi.org/10.1183/23120541.00460-2020\",\"url_pubmed\":\"https://pubmed.ncbi.nlm.nih.gov/33263052/\",\"url_full_text\":\"https://openres.ersjournals.com/content/6/4/00460-2020\",\"url_trial_reg\":\"https://clinicaltrials.gov/study/NCT03620630\",\"n\":60,\"setting\":\"Multi-site England\",\"key_results\":\"No significant difference in CAT score (−1.27, 95% CI −4.47–1.92, p=0.44). Inhaler error OR 0.30 (p=0.061) favouring myCOPD. PAM OR 1.65 favouring myCOPD.\",\"study_limitation\":\"Primary outcome (CAT) not met. p=0.061 for inhaler errors does not reach p\u003c0.05 threshold.\",\"peer_reviewed\":true,\"coi\":false,\"data_quality_flag\":true,\"data_quality_note\":\"Company describes inhaler error result (p=0.061) as statistically significant. This does not meet the conventional p\u003c0.05 threshold. Do not cite as definitive evidence without noting this caveat.\"},{\"id\":\"nhs-grampian-se\",\"ref\":\"NHS Grampian service evaluation (MMH-E04)\",\"type\":\"service_eval\",\"type_label\":\"Service evaluation\",\"authors\":\"Stonehaven Medical Group \u0026 Aberdeenshire HSCP\",\"journal\":null,\"year\":2020,\"month\":null,\"volume_issue\":null,\"doi\":null,\"pmid\":null,\"pmc\":null,\"trial_reg\":null,\"url_doi\":null,\"url_pubmed\":null,\"url_full_text\":\"https://mymhealth.com/studies\",\"n\":64,\"setting\":\"Primary care, Aberdeenshire, 5 months (2019–2020)\",\"key_results\":\"Rescue inhaler use: 3.17→2.13/week. Inhaler technique: 48%→91% correct. Reduction in unscheduled GP visits and hospital admissions. Led to ICB-level commissioning decision.\",\"study_limitation\":\"Service evaluation, not peer-reviewed. Reflects specific local deployment conditions.\",\"peer_reviewed\":false,\"coi\":false,\"data_quality_flag\":false,\"data_quality_note\":null,\"source_label\":\"my mhealth evidence catalogue\",\"source_url\":\"https://mymhealth.com/studies\"},{\"id\":\"nhs-highland\",\"ref\":\"NHS Highland feasibility study\",\"type\":\"observational\",\"type_label\":\"Observational study\",\"authors\":\"Cooper R et al.\",\"journal\":\"JMIR mHealth and uHealth\",\"year\":2022,\"month\":\"February\",\"volume_issue\":\"10(2):e30782\",\"doi\":\"10.2196/30782\",\"pmid\":\"35129453\",\"pmc\":\"8861861\",\"trial_reg\":null,\"url_doi\":\"https://doi.org/10.2196/30782\",\"url_pubmed\":\"https://pubmed.ncbi.nlm.nih.gov/35129453/\",\"url_full_text\":\"https://mhealth.jmir.org/2022/2/e30782\",\"n\":113,\"setting\":\"NHS Highland, up to 1 year\",\"key_results\":\"78.8% activation rate. No correlation between app use and age, wealth, rurality or COPD severity. No significant population-level reduction in NHS resource use. Very high-use subgroup (17%) showed moderate reduction in admissions and bed days.\",\"study_limitation\":\"No significant population-level reduction in NHS resource use in the full cohort.\",\"peer_reviewed\":true,\"coi\":false,\"data_quality_flag\":false,\"data_quality_note\":null},{\"id\":\"dorset-pop\",\"ref\":\"NHS Dorset population health study (MMH-E07)\",\"type\":\"service_eval\",\"type_label\":\"Service evaluation\",\"authors\":\"Our Digital Dorset / my mhealth\",\"journal\":null,\"year\":2022,\"month\":null,\"volume_issue\":null,\"doi\":null,\"pmid\":null,\"pmc\":null,\"trial_reg\":null,\"url_doi\":null,\"url_pubmed\":null,\"url_full_text\":\"https://mymhealth.com/studies\",\"n\":null,\"setting\":\"NHS Dorset ICS\",\"key_results\":\"Integration with Dorset Intelligence and Insight Service (DiiS). Socioeconomic factors did not negatively influence activation. Clinician remote monitoring of CAT scores at population level demonstrated.\",\"study_limitation\":\"Service evaluation — not peer-reviewed.\",\"peer_reviewed\":false,\"coi\":false,\"data_quality_flag\":false,\"data_quality_note\":null,\"source_label\":\"my mhealth evidence catalogue (MMH-E07)\",\"source_url\":\"https://mymhealth.com/studies\"},{\"id\":\"ml-exacerbation\",\"ref\":\"ML exacerbation prediction — BigMedilytics Pilot 4\",\"type\":\"observational\",\"type_label\":\"Observational / ML study\",\"authors\":\"Chmiel FP et al.\",\"journal\":\"JMIR Medical Informatics\",\"year\":2022,\"month\":\"March\",\"volume_issue\":\"10(3):e26499\",\"doi\":\"10.2196/26499\",\"pmid\":\"35311685\",\"pmc\":\"8981014\",\"trial_reg\":null,\"url_doi\":\"https://doi.org/10.2196/26499\",\"url_pubmed\":\"https://pubmed.ncbi.nlm.nih.gov/35311685/\",\"url_full_text\":\"https://medinform.jmir.org/2022/3/e26499\",\"n\":2374,\"setting\":\"University of Southampton \u0026 my mhealth (EU-funded, BigMedilytics)\",\"key_results\":\"AUROC 0.727 (95% CI 0.720–0.735) for predicting exacerbation within 3 days. 68,139 patient self-reports analysed.\",\"study_limitation\":\"Research stage only — not a deployed product feature in current versions.\",\"peer_reviewed\":true,\"coi\":false,\"data_quality_flag\":false,\"data_quality_note\":\"Research stage. Not deployed in current product.\"},{\"id\":\"nice-mtg68\",\"ref\":\"NICE MTG68 health economics assessment\",\"type\":\"nice_assessment\",\"type_label\":\"NICE technology appraisal\",\"authors\":\"York Health Economics Consortium (EAG); review: Davies H et al.\",\"journal\":\"Applied Health Economics and Health Policy (review)\",\"year\":2022,\"month\":\"March\",\"volume_issue\":\"21:689–700 (review article, 2023)\",\"doi\":null,\"pmid\":\"37246188\",\"pmc\":null,\"trial_reg\":null,\"url_doi\":null,\"url_pubmed\":\"https://pubmed.ncbi.nlm.nih.gov/37246188/\",\"url_full_text\":\"https://www.nice.org.uk/guidance/mtg68\",\"n\":null,\"setting\":\"England, health economics model\",\"key_results\":\"EAG-adjusted models: £86,297 cost saving per CCG (AECOPD, 74% probability); £22,779 per CCG (PR, 86% probability). Reviewed 3 RCTs, 1 observational study, 22 real-world evidence documents.\",\"study_limitation\":\"CCG-era model — CCGs dissolved July 2022. Recalculate using current ICB population size and local COPD prevalence for any new business case.\",\"peer_reviewed\":true,\"coi\":false,\"data_quality_flag\":true,\"data_quality_note\":\"Models use CCG-era population sizes. Commissioners must recalculate for ICB/PCN populations.\",\"source_label\":\"NICE MTG68\",\"source_url\":\"https://www.nice.org.uk/guidance/mtg68\"}],\"supplier_contact_email\":\"nhs@mymhealth.com\",\"supplier_contact_name\":\"my mhealth NHS team\",\"nhs_app_integration\":false,\"nhs_login_integration\":true,\"nhs_notify_integration\":false,\"monitoring_model\":\"Essentials: patient self-managed. Pro: clinician dashboard with remote monitoring — not 24/7.\",\"minimum_conditions_for_success\":\"Respiratory clinical lead, pathway agreement with clinical teams, minimum 500 patient cohort for meaningful outcome data.\",\"content_confidence\":\"Confirmed\",\"cyber_notes\":\"Cyber Essentials held (annual renewal). ISO 27001 not confirmed in reviewed sources.\",\"linked_funding_ids\":[\"nhse-copd-wave2\"],\"technical_integrations\":{\"fhir\":\"Not confirmed\",\"emis\":\"Not confirmed\",\"nhs_app\":false,\"population_health_dashboard\":true,\"device_integration\":\"No device integration required for Essentials tier. Pro tier supports clinician dashboard.\",\"languages\":[\"English\"],\"data_hosting\":\"UK/EU-based servers\"},\"context_of_use\":{\"population\":\"Adults aged 18+ with COPD (all GOLD grades A - E)\",\"pathways\":[\"Self-management\",\"Pulmonary rehabilitation\",\"Post-exacerbation support\",\"Remote monitoring (Pro)\"],\"care_settings\":[\"Primary care\",\"Community\",\"Secondary care outpatients\"],\"therapeutic_purpose\":\"Self-management education, inhaler technique training, home PR programme, remote symptom monitoring\",\"hcp_involvement\":\"Essentials: minimal. Pro: clinician dashboard review required\",\"nice_scope\":\"NICE HTE19 (HTG736) — recommended during 3-year evidence generation period\"}},{\"id\":\"luscii\",\"slug\":\"luscii\",\"app_name\":\"Luscii\",\"supplier_name\":\"Luscii Healthtech B.V. (OMRON Healthcare service)\",\"short_name\":\"Luscii\",\"logo_path\":\"/logos/luscii.jpg\",\"condition_tags\":[\"copd\"],\"pathway_tags\":[\"remote-monitoring\",\"virtual-ward\",\"hospital-at-home\",\"post-exacerbation\"],\"outcome_tags\":[\"admissions-reduction\",\"remote-management\",\"virtual-ward\",\"scale\"],\"supervision_model\":\"active_remote_management\",\"referral_modes\":[\"clinician_referral\"],\"one_line_value_proposition\":\"Remote monitoring platform with 25 million global registrations. Can be used as a stand alone system or integrated with local electronic healthcare record systems and clinical work flows\",\"why_it_matters_locally\":\"Luscii enables ICBs to build virtual COPD wards at scale without lengthy configuration delays. G-Cloud 14 listing means no separate OJEU tender is required. North West London ICS enrolled 6,000 COPD patients one year ahead of schedule in its implementation.\",\"target_problem_statement\":\"Limited virtual ward capacity, high COPD admission rates, post-exacerbation monitoring gaps and slow procurement of remote monitoring technology.\",\"nice_guidance_refs\":[{\"ref\":\"NICE HTE19 (HTG736)\",\"url\":\"https://www.nice.org.uk/guidance/htg736\",\"type\":\"EVA\",\"date\":\"December 2024\"},{\"ref\":\"NICE ARI guidance\",\"url\":\"https://www.nice.org.uk/guidance/ng237\",\"type\":\"EVA\",\"date\":\"March 2024\",\"note\":\"Separate recommendation for Acute Respiratory Infection remote monitoring\"}],\"evidence_summary\":\"Real-world evidence from NWL ICS (6,000 COPD patients), Bradford District and Craven ICB (6,000 COPD patients, £400k NHSE investment), Sunderland virtual COPD clinic (50% admission reduction — attribution caveated), and MTW NHS Trust virtual ward. Imperial College HFrEF retention study (2% drop-out at 3 months). Published SAFE@HOME academic studies (preeclampsia). DTAC confirmed in G-Cloud 14 (April 2024). No standalone peer-reviewed RCT for Luscii in COPD identified.\",\"evidence_strength\":\"moderate\",\"evidence_strength_rationale\":\"NICE-prioritised evidence was UK before-after/case-series data, but a Luscii/cVitals randomised crossover study in Sweden exists and was feasible/safe without QoL benefit. RCT presence plus mid-scale implementation supports Moderate rather than Strong.\",\"case_studies\":[{\"title\":\"NWL ICS: UK's largest COPD remote monitoring programme\",\"setting\":\"North West London ICS / Imperial College Healthcare NHS Trust, 2022–2023\",\"sample_size\":6000,\"outcome\":\"6,000 COPD patient target met within 1 year — 12 months ahead of the 2-year programme target. MyCare24 24/7 monitoring hub operational.\",\"caveat\":\"Programme scale and pace data from Luscii G-Cloud 14 Service Definition — not independently peer-reviewed. Outcomes reflect specific NWL ICS configuration including 24/7 hub model.\",\"source\":\"Luscii G-Cloud 14 Service Definition (NHS Digital Marketplace, 2024)\"},{\"title\":\"Bradford District and Craven ICB, COPD scale-up\",\"setting\":\"Bradford District and Craven ICB, 2021-2023\",\"sample_size\":6000,\"outcome\":\"6,000 COPD patients enrolled over 2 years. £400,000+ NHSE investment. Commenced as 50-patient COVID-19 recovery pilot.\",\"caveat\":\"Source is Luscii G-Cloud 14 Service Definition, not independently peer-reviewed.\",\"source\":\"Luscii G-Cloud 14 Service Definition (NHS Digital Marketplace, 2024)\"}],\"maturity_level\":\"scaled\",\"live_sites\":\"NWL ICS / Imperial College Healthcare NHS Trust, Bradford District and Craven ICB, South Tyneside and Sunderland NHS FT (attribution caveated), Airedale NHS Foundation Trust, Maidstone and Tunbridge Wells NHS Trust, NHS Dorset (asthma), 11+ countries internationally\",\"named_sites\":[{\"name\":\"NWL ICS / Imperial College Healthcare NHS Trust\",\"status\":\"active\"},{\"name\":\"Bradford District and Craven ICB\",\"status\":\"active\"},{\"name\":\"South Tyneside and Sunderland NHS FT (attribution caveated)\",\"status\":\"active\"},{\"name\":\"Airedale NHS Foundation Trust\",\"status\":\"active\"},{\"name\":\"Maidstone and Tunbridge Wells NHS Trust\",\"status\":\"active\"},{\"name\":\"NHS Dorset (asthma)\",\"status\":\"active\"},{\"name\":\"International deployments (11+ countries)\",\"status\":\"active\"}],\"live_icbs\":4,\"patients_covered_note\":\"25 million+ global registrations across all conditions. 6,000+ COPD patients in North West London ICS alone. 350+ remote monitoring pathways delivered globally.\",\"dtac_status\":\"passed\",\"dtac_note\":\"DTAC completed — confirmed in G-Cloud 14 Service Definition (April 2024). Most recently confirmed DTAC status of the four HTE19-recommended COPD apps.\",\"device_class\":\"Class IIa SaMD\",\"dcb0129_status\":\"Confirmed\",\"dcb0160_boilerplate_available\":true,\"dspt_status\":\"Compliant\",\"iso27001\":\"Not confirmed in reviewed sources\",\"cyber_essentials\":\"Not confirmed in reviewed sources\",\"gdpr_note\":\"Patient data on Amazon AWS servers in Germany. Encrypted at rest. Daily full backups + 5-minute transaction logs. DPIA required as part of local commissioning process.\",\"target_patients\":\"Adults with COPD (any severity). Platform also supports 150+ other LTC pathways.\",\"exclusions\":\"Pulse oximeter required for standard COPD protocol — organisations must procure and supply devices to patients.\",\"onboarding_model\":\"clinician_led\",\"onboarding_detail\":\"Introductory patient call model (as per NWL ICS). Patient sets up app and Bluetooth oximeter with clinical support. 150+ pre-built pathways available immediately from Luscii Library. Custom pathways via Luscii Builder (Medical Developer certification required).\",\"supplier_wrap\":\"Co-creates remote monitoring strategy with each NHS organisation. Comprehensive implementation plans and stakeholder mapping. Luscii staff visit wards during setup. 24/7 monitoring hub support available.\",\"local_wraparound\":\"high\",\"local_wraparound_detail\":\"Clinical team or contracted 24/7 monitoring hub required. Pulse oximeters must be procured and supplied to patients. AWS Germany data residency requires DPIA review. Pathway design needed (either pre-built or custom via Builder).\",\"training_required\":true,\"training_note\":\"Certified Medical Developer programme available: clinicians complete online course → certificate → Luscii Builder access. 70% revenue share for Library-listed programmes.\",\"monitoring_note\":\"Active remote management model. Clinical Engine AI generates alerts for missed measurements, out-of-range readings and patient comments. Must be reviewed by clinical team or contracted hub.\",\"escalation_note\":\"Alerts projected as FHIR Flags to connected EHR/EPR. Clinical team configures alert thresholds and escalation protocols.\",\"operating_hours_caveat\":\"Virtual ward model requires staffed monitoring capability — either in-house or contracted (e.g. MyCare24 model). Confirm monitoring hours before deployment.\",\"implementation_prerequisites\":[\"Pulse oximeters procured and supplied to patients\",\"Clinical team or 24/7 monitoring hub contracted\",\"DPIA completed for AWS Germany data residency\",\"Pathway selected from Library or built via Luscii Builder\",\"DTAC approval confirmed locally\",\"Evidence generation agreement with NICE\"],\"pricing_model\":\"Local negotiation required\",\"national_price_available\":false,\"indicative_price_text\":\"Pricing is typically per-patient-per-month for active monitoring. Indicative range: £30–£60 per patient per month depending on volume and service level. Implementation costs quoted separately. Listed on NHS G-Cloud 14 (Digital Marketplace) as ‘System-wide Remote Patient Monitoring Service’ — contact Luscii via luscii.co.uk.\",\"pricing_confidence\":\"supplier_reported\",\"free_offer_flag\":false,\"service_wrap_included\":true,\"service_wrap_description\":\"Standard contract includes platform access, implementation support, clinical pathway design, training, technical support, and reporting. Premium tier available with dedicated clinical advisory support and custom integrations.\",\"service_wrap_note\":\"Comprehensive implementation support included. Confirm scope of 24/7 monitoring hub support in contract.\",\"contract_note\":\"Listed on NHS G-Cloud 14 (Digital Marketplace) as 'System-wide Remote Patient Monitoring Service' — procurement without separate OJEU tender is a significant process advantage.\",\"procurement_notes\":\"Available via SBRI Healthcare contract. Direct procurement with Luscii/OMRON also possible.\",\"expected_benefit_note\":\"Primary benefit is supporting virtual ward delivery and potentially reducing readmissions for COPD when monitoring and response processes are strong.\",\"financial_expected_benefit_note\":\"Primary benefit is supporting virtual ward delivery and potentially reducing readmissions for COPD when monitoring and response processes are strong. NWL ICS enrolled 6,000 COPD patients ahead of schedule; Bradford reached similar scale with NHSE investment. Technology alone does not deliver outcomes.\",\"tariff_considerations\":\"Virtual ward activity may be funded under the national virtual ward programme. Commissioners should confirm local funding arrangements and whether technology costs are within scope. Remote monitoring does not currently attract a separate tariff outside virtual ward frameworks. Model locally using admission and cost data.\",\"provider_income_note\":\"Supports provider delivery of virtual ward targets, which may attract national funding. May reduce some inpatient and outpatient activity over time — factor into pathway economics.\",\"roi_note\":\"Supplier provides ROI modelling based on admission avoidance assumptions. Sunderland 50% respiratory admission reduction is cited in market materials but attribution is contested (see data quality note). Independent NHS evaluation data is still emerging. Commissioners should model locally.\",\"funding_ids\":[],\"nhse_125k_eligible\":null,\"nhse_125k_note\":\"Eligibility for NHSE ICB £125k COPD funding not confirmed for Luscii in reviewed sources. Verify with NHSE before including in business case.\",\"data_quality_note\":\"The 50% respiratory admission reduction cited for Sunderland is also claimed by Clinitouch/Spirit Health for the same geography. Attribution cannot be confirmed from public sources — do not use in comparative commissioning claims without verification from South Tyneside and Sunderland NHS Foundation Trust.\",\"demo_variants\":[{\"label\":\"Luscii UK website\",\"url\":\"https://luscii.co.uk\",\"type\":\"website\"},{\"label\":\"Integration documentation\",\"url\":\"https://integrations.luscii.com\",\"type\":\"website\"}],\"demo_notes\":\"Contact Luscii via luscii.co.uk for a configured demonstration environment.\",\"last_reviewed_date\":\"2026-03-17\",\"source_summary\":\"NICE HTG736, Luscii G-Cloud 14 Service Definition (NHS Digital Marketplace 2024), HTN interview February 2024 (MTW case study), All Together Better Alliance press release March 2020, luscii.co.uk/evidence.\",\"confidence_note\":\"Content based on publicly available information including G-Cloud 14 Service Definition. Device classification caveated — confirm COPD-specific CE certificate with Luscii.\",\"clinical_evidence_detailed\":[{\"id\":\"nwl-ics\",\"ref\":\"NWL ICS / Imperial College Healthcare NHS Trust COPD programme\",\"type\":\"real_world\",\"type_label\":\"Real-world NHS programme data\",\"authors\":\"Dr Sarah Elkin, Consultant Respiratory Medicine, Imperial College Healthcare NHS Trust\",\"journal\":null,\"year\":2023,\"month\":null,\"volume_issue\":null,\"doi\":null,\"pmid\":null,\"pmc\":null,\"trial_reg\":null,\"url_doi\":null,\"url_pubmed\":null,\"url_full_text\":\"https://www.digitalmarketplace.service.gov.uk/g-cloud/services/716511\",\"n\":6000,\"setting\":\"North West London ICS, 2022 - 2023. MyCare24 24/7 monitoring hub.\",\"key_results\":\"6,000 COPD patient target met within 1 year; 12 months ahead of the 2-year programme target. Weekly SpO2/HR monitoring, CAT/CCQ questionnaires, Know Your Normal, and educational lessons deployed.\",\"study_limitation\":\"Data from Luscii G-Cloud 14 Service Definition, not independently peer-reviewed.\",\"peer_reviewed\":false,\"coi\":false,\"data_quality_flag\":false,\"data_quality_note\":null,\"source_label\":\"Luscii G-Cloud 14 Service Definition (NHS Digital Marketplace, 2024)\",\"source_url\":\"https://www.digitalmarketplace.service.gov.uk/g-cloud/services/716511\"},{\"id\":\"bradford-icb\",\"ref\":\"Bradford District and Craven ICB COPD programme\",\"type\":\"real_world\",\"type_label\":\"Real-world NHS programme data\",\"authors\":\"Dr Katherine Hickman, GP Respiratory Lead, Bradford District and Craven ICB\",\"journal\":null,\"year\":2023,\"month\":null,\"volume_issue\":null,\"doi\":null,\"pmid\":null,\"pmc\":null,\"trial_reg\":null,\"url_doi\":null,\"url_pubmed\":null,\"url_full_text\":\"https://www.digitalmarketplace.service.gov.uk/g-cloud/services/716511\",\"n\":6000,\"setting\":\"Bradford District and Craven ICB, 2021 - 2023. £400,000+ NHSE investment.\",\"key_results\":\"6,000 COPD patients enrolled over 2 years. Commenced as 50-patient COVID-19 recovery pilot (2021) and expanded into full COPD programme. Air quality alerts and Know Your Normal in use.\",\"study_limitation\":\"Source is Luscii G-Cloud 14 Service Definition, not independently peer-reviewed.\",\"peer_reviewed\":false,\"coi\":false,\"data_quality_flag\":false,\"data_quality_note\":null,\"source_label\":\"Luscii G-Cloud 14 Service Definition (NHS Digital Marketplace, 2024)\",\"source_url\":\"https://www.digitalmarketplace.service.gov.uk/g-cloud/services/716511\"},{\"id\":\"sunderland-atb\",\"ref\":\"Sunderland — All Together Better Alliance virtual COPD clinic\",\"type\":\"real_world\",\"type_label\":\"Real-world NHS programme data\",\"authors\":\"Recovery at Home team, South Tyneside and Sunderland NHS FT\",\"journal\":null,\"year\":2020,\"month\":\"March\",\"volume_issue\":null,\"doi\":null,\"pmid\":null,\"pmc\":null,\"trial_reg\":null,\"url_doi\":null,\"url_pubmed\":null,\"url_full_text\":\"https://atbsunderland.org.uk\",\"url_evidence\":\"https://luscii.co.uk/evidence\",\"n\":null,\"setting\":\"South Tyneside and Sunderland NHS FT, pilot commenced March 2020\",\"key_results\":\"50% reduction in respiratory emergency admissions. 24/7 virtual COPD clinic. Socioeconomically deprived population; iPads provided to address digital inclusion.\",\"study_limitation\":\"All Together Better press release (2020) confirms Luscii was the pilot technology. However, later Clinitouch deployment in same area creates ambiguity about longer-term outcomes data.\",\"peer_reviewed\":false,\"coi\":false,\"data_quality_flag\":true,\"data_quality_note\":\"Attribution unverified. Same outcome data also cited by Clinitouch/Spirit Health for the same geography. Verify with South Tyneside and Sunderland NHS FT before using in comparative commissioning materials.\",\"source_label\":\"All Together Better Alliance press release (March 2020)\",\"source_url\":\"https://atbsunderland.org.uk\"},{\"id\":\"mtw-virtual-ward\",\"ref\":\"Maidstone and Tunbridge Wells NHS Trust virtual COPD ward\",\"type\":\"real_world\",\"type_label\":\"NHS case study / interview\",\"authors\":\"Respiratory team, Maidstone and Tunbridge Wells NHS Trust\",\"journal\":\"HTN (Health Tech Newspaper)\",\"year\":2024,\"month\":\"February\",\"volume_issue\":null,\"doi\":null,\"pmid\":null,\"pmc\":null,\"trial_reg\":null,\"url_doi\":null,\"url_pubmed\":null,\"url_full_text\":\"https://htn.co.uk/2024/02/29/featured-interview-luscii-and-maidstone-and-tunbridge-wells-nhs-trust-on-virtual-wards-for-acute-settings/\",\"n\":null,\"setting\":\"Maidstone and Tunbridge Wells NHS Trust, 2023 - 2024\",\"key_results\":\"Virtual COPD ward expanded from monitoring-only to include acute and A\u0026E escalation pathways. Luscii Builder used to create bespoke escalation pathway.\",\"study_limitation\":\"Published interview, not peer-reviewed.\",\"peer_reviewed\":false,\"coi\":false,\"data_quality_flag\":false,\"data_quality_note\":null,\"source_label\":\"HTN interview, 29 February 2024\",\"source_url\":\"https://htn.co.uk/2024/02/29/featured-interview-luscii-and-maidstone-and-tunbridge-wells-nhs-trust-on-virtual-wards-for-acute-settings/\"},{\"id\":\"imperial-hf\",\"ref\":\"Imperial College, Heart Failure retention study\",\"type\":\"observational\",\"type_label\":\"Observational study\",\"authors\":\"Imperial College Healthcare NHS Trust\",\"journal\":null,\"year\":null,\"month\":null,\"volume_issue\":null,\"doi\":null,\"pmid\":null,\"pmc\":null,\"trial_reg\":null,\"url_doi\":null,\"url_pubmed\":null,\"url_full_text\":\"https://luscii.co.uk/evidence\",\"n\":146,\"setting\":\"Imperial College Healthcare NHS Trust, HFrEF patients, 3 months\",\"key_results\":\"2% drop-out rate at 3 months. Demonstrates strong patient retention in Luscii-enabled monitoring pathways.\",\"study_limitation\":\"Specific peer-reviewed publication not identified in reviewed sources. Source is Luscii UK evidence page.\",\"peer_reviewed\":false,\"coi\":false,\"data_quality_flag\":false,\"data_quality_note\":null,\"source_label\":\"Luscii UK evidence page\",\"source_url\":\"https://luscii.co.uk/evidence\"},{\"id\":\"safe-home\",\"ref\":\"SAFE@HOME, preeclampsia remote monitoring\",\"type\":\"observational\",\"type_label\":\"Published academic studies (multiple)\",\"authors\":\"Multiple authors\",\"journal\":\"JMIR and others\",\"year\":null,\"month\":null,\"volume_issue\":null,\"doi\":null,\"pmid\":null,\"pmc\":null,\"trial_reg\":null,\"url_doi\":null,\"url_pubmed\":null,\"url_full_text\":\"https://luscii.co.uk/evidence\",\"n\":null,\"setting\":\"Netherlands, pregnancy hypertension monitoring\",\"key_results\":\"Published peer-reviewed studies on Luscii in preeclampsia remote monitoring. Demonstrates platform evidence generation capability across conditions beyond COPD.\",\"study_limitation\":\"Not directly applicable to COPD commissioning decisions. Cross-condition platform evidence only.\",\"peer_reviewed\":true,\"coi\":false,\"data_quality_flag\":false,\"data_quality_note\":null,\"source_label\":\"Luscii evidence page\",\"source_url\":\"https://luscii.co.uk/evidence\"},{\"id\":\"nice-hte19-luscii\",\"ref\":\"NICE HTE19 (HTG736) recommendation\",\"type\":\"nice_assessment\",\"type_label\":\"NICE technology guidance\",\"authors\":\"NICE\",\"journal\":null,\"year\":2024,\"month\":\"December\",\"volume_issue\":null,\"doi\":null,\"pmid\":null,\"pmc\":null,\"trial_reg\":null,\"url_doi\":null,\"url_pubmed\":null,\"url_full_text\":\"https://www.nice.org.uk/guidance/htg736\",\"n\":null,\"setting\":\"England\",\"key_results\":\"Recommended for NHS use during 3-year evidence generation period. DTAC confirmed (G-Cloud 14 April 2024).\",\"study_limitation\":\"Evidence generation period — full NICE recommendation pending ~December 2027.\",\"peer_reviewed\":false,\"coi\":false,\"data_quality_flag\":false,\"data_quality_note\":null,\"source_label\":\"NICE HTG736\",\"source_url\":\"https://www.nice.org.uk/guidance/htg736\"}],\"supplier_contact_email\":\"nhs@luscii.com\",\"supplier_contact_name\":\"Luscii NHS team\",\"nhs_app_integration\":false,\"interop_snapshot_show_nhs_app\":true,\"nhs_login_integration\":true,\"nhs_notify_integration\":true,\"monitoring_model\":\"Active remote monitoring with automated triage and clinical escalation pathways.\",\"minimum_conditions_for_success\":\"Dedicated monitoring hub or virtual ward team, OMRON devices distributed to patients, IT infrastructure for device connectivity.\",\"content_confidence\":\"Confirmed\",\"cyber_notes\":\"Netherlands-based company — confirm data residency and DPA terms for NHS use. ISO 27001 certified.\",\"linked_funding_ids\":[],\"technical_integrations\":{\"fhir\":\"FHIR R4 compatible\",\"emis\":\"Integration available\",\"nhs_app\":false,\"population_health_dashboard\":true,\"device_integration\":\"OMRON pulse oximeters, blood pressure monitors, spirometers via Bluetooth\",\"languages\":[\"English\",\"Dutch\"],\"data_hosting\":\"EU-based servers (Netherlands) — confirm DPA terms\"},\"context_of_use\":{\"population\":\"Adults with moderate-severe COPD or post-hospitalisation COPD patients\",\"pathways\":[\"Remote monitoring\",\"Virtual ward\",\"Post-discharge support\",\"Population health management\"],\"care_settings\":[\"Primary care\",\"Secondary care\",\"Virtual ward\",\"Community\"],\"therapeutic_purpose\":\"Active remote monitoring, automated triage, early exacerbation detection, population health management\",\"hcp_involvement\":\"Active monitoring hub team required for triage and escalation\",\"nice_scope\":\"NICE HTE19 (HTG736) recommended during 3-year evidence generation period\"}},{\"id\":\"myheart\",\"slug\":\"myheart\",\"app_name\":\"myHeart\",\"supplier_name\":\"my mhealth Limited\",\"short_name\":\"myHeart\",\"logo_path\":\"/logos/myheart.png\",\"condition_tags\":[\"cardiac_rehab\"],\"pathway_tags\":[\"cardiac-rehabilitation\",\"heart-failure\",\"post-cardiac-event\",\"remote-monitoring\",\"self-management\"],\"outcome_tags\":[\"self-management\",\"quality-of-life\",\"exercise-capacity\",\"cr-uptake\"],\"supervision_model\":\"self_management_only\",\"referral_modes\":[\"clinician_referral\"],\"one_line_value_proposition\":\"NICE HTG764-recommended cardiac rehabilitation app from the makers of myCOPD, over 20,800 UK users, DTAC completed, with the Dorset County Hospital case study showing 70% CR uptake (surpassing the 2028 NHS target).\",\"why_it_matters_locally\":\"myHeart has the largest documented NHS deployment among HTG764-recommended platforms, with over 20,800 UK users since 2018. The Dorset County Hospital case study demonstrated 70% CR uptake, surpassing the 2028 NHS Long-Term Plan target. Built on the my mhealth platform (which also powers myCOPD), it benefits from an established NHS relationship and DTAC completion.\",\"target_problem_statement\":\"Low national CR uptake rates, limited capacity for home-based CR delivery, and the 2028 NHS Long-Term Plan target to increase CR uptake to 85%.\",\"nice_guidance_refs\":[{\"ref\":\"NICE HTG764\",\"url\":\"https://www.nice.org.uk/guidance/htg764\",\"type\":\"EVA\",\"date\":\"December 2025\",\"note\":\"Conditionally recommended, one of four platforms with direct clinical evidence\"}],\"evidence_summary\":\"Large real-world evidence base: UH Derby \u0026 Burton evaluation (721 patients) showed significantly lower drop-out rates with myHeart vs without. COVID-19 multi-site evaluation (5 NHS services): 89.7% of users accessed CR videos, 99.7% within first 6 weeks. Dorset County Hospital: 70% CR uptake achieved, surpassing 2028 NHS target. CUOREMA Eurostars Grant (€2.5M) for international research collaboration. NICE identifies myHeart as one of four platforms with direct clinical evidence.\",\"evidence_strength\":\"moderate\",\"evidence_strength_rationale\":\"NICE identified one small UK three-way RCT and a 434-person real-world evaluation. Evidence supports NICE evidence generation, but the RCT is small, some evidence is observational/conference-based.\",\"clinical_evidence_detailed\":[{\"id\":\"uh-derby-burton-eval\",\"ref\":\"UH Derby \u0026 Burton NHS FT evaluation\",\"type\":\"real_world\",\"type_label\":\"Real-world evidence / service evaluation\",\"authors\":null,\"journal\":null,\"year\":null,\"month\":null,\"volume_issue\":null,\"doi\":null,\"pmid\":null,\"pmc\":null,\"trial_reg\":null,\"url_doi\":null,\"url_pubmed\":null,\"url_pmc\":null,\"url_full_text\":\"https://mymhealth.com/studies\",\"url_trial_reg\":null,\"url_case_study\":null,\"n\":721,\"setting\":\"University Hospitals of Derby and Burton NHSFT\",\"key_results\":\"721 patients across 4 groups. Drop-out rates significantly lower with myHeart: Class+App 25.6% vs Class-only 58.2%; Home+App 42.6% vs Home-only 73.5%.\",\"study_limitation\":\"Service evaluation, not a peer-reviewed RCT. No control for confounders beyond group allocation.\",\"peer_reviewed\":false,\"coi\":false,\"data_quality_flag\":false,\"data_quality_note\":null,\"source_label\":\"my mhealth evidence catalogue\",\"source_url\":\"https://mymhealth.com/studies\"},{\"id\":\"covid-multisite-eval\",\"ref\":\"COVID-19 multi-site evaluation (MMH-E092)\",\"type\":\"real_world\",\"type_label\":\"Real-world evidence / multi-site service evaluation\",\"authors\":null,\"journal\":null,\"year\":2020,\"month\":null,\"volume_issue\":null,\"doi\":null,\"pmid\":null,\"pmc\":null,\"trial_reg\":null,\"url_doi\":null,\"url_pubmed\":null,\"url_pmc\":null,\"url_full_text\":\"https://mymhealth.com/studies\",\"url_trial_reg\":null,\"url_case_study\":null,\"n\":null,\"setting\":\"5 NHS CR services, March–October 2020\",\"key_results\":\"89.7% of users accessed CR videos; 99.7% within first 6 weeks. Demonstrated platform utility during COVID-19 disruption to face-to-face CR services.\",\"study_limitation\":\"COVID-19 context, rapid adoption may not reflect steady-state engagement. Sample size not stated in dossier.\",\"peer_reviewed\":false,\"coi\":false,\"data_quality_flag\":false,\"data_quality_note\":null,\"source_label\":\"my mhealth evidence catalogue (MMH-E092)\",\"source_url\":\"https://mymhealth.com/studies\"},{\"id\":\"dorset-county-case-study\",\"ref\":\"Dorset County Hospital, achieving 2028 NHS targets\",\"type\":\"service_eval\",\"type_label\":\"Service evaluation / case study\",\"authors\":null,\"journal\":null,\"year\":null,\"month\":null,\"volume_issue\":null,\"doi\":null,\"pmid\":null,\"pmc\":null,\"trial_reg\":null,\"url_doi\":null,\"url_pubmed\":null,\"url_pmc\":null,\"url_full_text\":null,\"url_trial_reg\":null,\"url_case_study\":\"https://mymhealth.com/myheart/cardiac-rehabilitation\",\"n\":null,\"setting\":\"Dorset County Hospital NHSFT (since 2017, early adopter)\",\"key_results\":\"70% CR uptake achieved, surpassing the 2028 NHS Long-Term Plan target. Usage increased 23.7% during COVID-19.\",\"study_limitation\":\"Service evaluation. Single-site case study at an early-adopter site, results may not be generalisable to all NHS settings.\",\"peer_reviewed\":false,\"coi\":false,\"data_quality_flag\":false,\"data_quality_note\":null,\"source_label\":\"my mhealth case study\",\"source_url\":\"https://mymhealth.com/myheart/cardiac-rehabilitation\"},{\"id\":\"bacpr-2023-poster\",\"ref\":\"BACPR Annual Conference 2023, psychological outcomes poster\",\"type\":\"grey_lit\",\"type_label\":\"Conference poster presentation\",\"authors\":null,\"journal\":null,\"year\":2023,\"month\":null,\"volume_issue\":null,\"doi\":null,\"pmid\":null,\"pmc\":null,\"trial_reg\":null,\"url_doi\":null,\"url_pubmed\":null,\"url_pmc\":null,\"url_full_text\":null,\"url_trial_reg\":null,\"url_case_study\":null,\"n\":null,\"setting\":\"BACPR Annual Conference 2023\",\"key_results\":\"Poster presentation on psychological outcomes associated with myHeart use in cardiac rehabilitation.\",\"study_limitation\":\"Conference poster, not a full peer-reviewed publication. Detailed results not available in dossier.\",\"peer_reviewed\":false,\"coi\":null,\"data_quality_flag\":false,\"data_quality_note\":null},{\"id\":\"cuorema-eurostars-grant\",\"ref\":\"CUOREMA Eurostars Grant (€2.5M)\",\"type\":\"grey_lit\",\"type_label\":\"Research grant / international collaboration\",\"authors\":null,\"journal\":null,\"year\":null,\"month\":null,\"volume_issue\":null,\"doi\":null,\"pmid\":null,\"pmc\":null,\"trial_reg\":null,\"url_doi\":null,\"url_pubmed\":null,\"url_pmc\":null,\"url_full_text\":null,\"url_trial_reg\":null,\"url_case_study\":null,\"n\":null,\"setting\":\"International collaboration, Swiss and Dutch partners\",\"key_results\":\"€2.5M Eurostars grant for biofeedback, AI algorithms, and gamification in cardiac rehabilitation. International collaboration with Swiss and Dutch research partners.\",\"study_limitation\":\"Research grant, results pending. Not yet published evidence.\",\"peer_reviewed\":false,\"coi\":false,\"data_quality_flag\":false,\"data_quality_note\":null,\"source_label\":\"my mhealth Eurostars announcement\",\"source_url\":null},{\"id\":\"nice-htg764-myheart\",\"ref\":\"NICE EVA HTG764, myHeart assessment\",\"type\":\"nice_assessment\",\"type_label\":\"NICE EVA technology assessment\",\"authors\":\"NICE External Assessment Group\",\"journal\":null,\"year\":2025,\"month\":\"December\",\"volume_issue\":null,\"doi\":null,\"pmid\":null,\"pmc\":null,\"trial_reg\":null,\"url_doi\":null,\"url_pubmed\":null,\"url_pmc\":null,\"url_full_text\":\"https://www.nice.org.uk/guidance/htg764\",\"url_trial_reg\":null,\"url_case_study\":null,\"n\":null,\"setting\":\"England, NICE health technology guidance\",\"key_results\":\"Conditionally recommended. myHeart assessed in two studies including one RCT. NICE identifies it as one of four platforms with direct clinical evidence suggesting potential reduction in secondary CV event risk. Over 20,800 UK users since 2018/2019.\",\"study_limitation\":\"Recommendation conditional on 3-year evidence generation period.\",\"peer_reviewed\":true,\"coi\":false,\"data_quality_flag\":false,\"data_quality_note\":null},{\"id\":\"myheart-nice-eag-economics\",\"ref\":\"NICE EAG economic model, cardiac rehabilitation platforms\",\"type\":\"nice_assessment\",\"type_label\":\"NICE EAG health economics assessment\",\"authors\":\"NICE External Assessment Group\",\"journal\":null,\"year\":2025,\"month\":\"December\",\"volume_issue\":null,\"doi\":null,\"pmid\":null,\"pmc\":null,\"trial_reg\":null,\"url_doi\":null,\"url_pubmed\":null,\"url_pmc\":null,\"url_full_text\":\"https://www.nice.org.uk/guidance/htg764\",\"url_trial_reg\":null,\"url_case_study\":null,\"n\":null,\"setting\":\"England, health economics model\",\"key_results\":\"EAG model found digital cardiac rehabilitation platforms (including myHeart) cost-saving compared with conventional rehabilitation. 275,000+ rehabilitation/education sessions delivered in 2020 across the mymhealth platform.\",\"study_limitation\":\"Generic model across all HTG764 platforms. Session count is platform-wide (includes myCOPD and other products), not myHeart-specific.\",\"peer_reviewed\":true,\"coi\":false,\"data_quality_flag\":true,\"data_quality_note\":\"275,000+ sessions figure is across the full mymhealth platform, not myHeart-specific. Do not cite as myHeart-only activity.\"},{\"id\":\"leeds-covid-adoption\",\"ref\":\"Leeds Community Healthcare NHS Trust, COVID-19 adoption\",\"type\":\"service_eval\",\"type_label\":\"Service evaluation / case study\",\"authors\":null,\"journal\":null,\"year\":2020,\"month\":null,\"volume_issue\":null,\"doi\":null,\"pmid\":null,\"pmc\":null,\"trial_reg\":null,\"url_doi\":null,\"url_pubmed\":null,\"url_pmc\":null,\"url_full_text\":\"https://mymhealth.com/studies\",\"url_trial_reg\":null,\"url_case_study\":null,\"n\":null,\"setting\":\"Leeds Community Healthcare NHS Trust (since 2020)\",\"key_results\":\"myHeart adopted during COVID-19 as a digital CR option. Part of multi-site COVID-19 adoption across NHS CR services.\",\"study_limitation\":\"Case study level, detailed outcome data for Leeds specifically not provided in dossier.\",\"peer_reviewed\":false,\"coi\":false,\"data_quality_flag\":false,\"data_quality_note\":null,\"source_label\":\"my mhealth evidence catalogue\",\"source_url\":\"https://mymhealth.com/studies\"}],\"case_studies\":[{\"title\":\"UH Derby \u0026 Burton NHS FT evaluation\",\"setting\":\"University Hospitals of Derby and Burton NHSFT\",\"sample_size\":721,\"outcome\":\"721 patients across 4 groups. Drop-out rates significantly lower with myHeart: Class+App 25.6% vs Class-only 58.2%; Home+App 42.6% vs Home-only 73.5%
